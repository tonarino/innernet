[workspace]
resolver = "2"

members = [
  "server",
  "client",
  "client-core",
  "hostsfile",
  "shared",
  "publicip",
  "netlink-request",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"

[workspace.package]
keywords = ["innernet", "networking", "overlay", "vpn", "wireguard"]

[workspace.dependencies]
colored = "2"
dialoguer = { version = "0.11", default-features = false }
netlink-packet-core = "0.8"
netlink-packet-generic = "0.4"
netlink-packet-route = "0.31"
netlink-packet-wireguard = "0.4"
netlink-sys = "0.8.5"
